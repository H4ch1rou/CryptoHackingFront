<VirtualHost *:80>
    ServerName localhost
    # Solo /public es accesible por la web. /src, /seed y /data quedan fuera.
    DocumentRoot /var/www/app/public

    <Directory /var/www/app/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Archivos auxiliares de los labs (prefijo _): no accesibles directamente.
    <FilesMatch "^_.*\.php$">
        Require all denied
    </FilesMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
